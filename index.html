<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>🧭 Travel Tracker</h1>
    <p class="subtitle">Countries and US states I've visited</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="world" role="tab" aria-selected="true">🌍 World</button>
    <button class="tab-btn" data-tab="usa" role="tab" aria-selected="false">🇺🇸 USA</button>
  </nav>

  <main>
    <section id="panel-world" class="panel active" data-panel="world">
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-value" id="world-count">0 / 0</span>
          <span class="stat-label">visited</span>
        </div>
        <div class="stat stat-planned">
          <span class="stat-value" id="world-planned-count">0</span>
          <span class="stat-label">planned</span>
        </div>
        <div class="progress">
          <div class="progress-fill visited-fill" id="world-progress"></div>
          <div class="progress-fill planned-fill" id="world-progress-planned"></div>
        </div>
        <span class="stat-pct" id="world-pct">0%</span>
      </div>

      <div class="map-layout">
        <div class="map-wrap">
          <svg id="world-map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet" aria-label="World map"></svg>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch visited"></span>Visited</span>
            <span class="legend-item"><span class="legend-swatch planned"></span>Planned</span>
            <span class="legend-item"><span class="legend-swatch"></span>Not yet</span>
          </div>
          <p class="map-hint">Click a country to cycle: not yet → visited → planned.</p>
        </div>
        <aside class="sidebar">
          <input type="search" id="world-search" placeholder="Search countries…" aria-label="Search countries">
          <ul class="place-list" id="world-list"></ul>
        </aside>
      </div>
    </section>

    <section id="panel-usa" class="panel" data-panel="usa">
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-value" id="usa-count">0 / 0</span>
          <span class="stat-label">visited</span>
        </div>
        <div class="stat stat-planned">
          <span class="stat-value" id="usa-planned-count">0</span>
          <span class="stat-label">planned</span>
        </div>
        <div class="progress">
          <div class="progress-fill visited-fill" id="usa-progress"></div>
          <div class="progress-fill planned-fill" id="usa-progress-planned"></div>
        </div>
        <span class="stat-pct" id="usa-pct">0%</span>
      </div>

      <div class="map-layout">
        <div class="map-wrap">
          <svg id="usa-map" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet" aria-label="Map of United States"></svg>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch visited"></span>Visited</span>
            <span class="legend-item"><span class="legend-swatch planned"></span>Planned</span>
            <span class="legend-item"><span class="legend-swatch"></span>Not yet</span>
          </div>
          <p class="map-hint">Click a state to cycle: not yet → visited → planned.</p>
        </div>
        <aside class="sidebar">
          <input type="search" id="usa-search" placeholder="Search states…" aria-label="Search states">
          <ul class="place-list" id="usa-list"></ul>
        </aside>
      </div>
    </section>
  </main>

  <footer class="toolbar">
    <button id="export-btn" type="button">⬇ Export data</button>
    <label class="import-label">
      ⬆ Import data
      <input type="file" id="import-input" accept="application/json" hidden>
    </label>
    <button id="reset-btn" type="button" class="danger">Reset all</button>
    <span class="save-note" id="save-note" aria-live="polite"></span>
  </footer>

  <div class="tooltip" id="tooltip" hidden></div>

  <script src="js/vendor/d3.min.js"></script>
  <script src="js/vendor/topojson-client.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
